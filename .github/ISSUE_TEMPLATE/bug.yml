name: 🐛 回報問題
description: 遊戲壞掉、卡住、訊息不對，或跟規則說明不一樣
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 謝謝回報！不確定是不是 bug 的話，也可以先到 [Discussions 的問答](https://github.com/eric0324/slack-gamebuddy/discussions) 問問看。
  - type: dropdown
    id: game
    attributes:
      label: 哪款遊戲？
      options:
        - 大廳／其他
        - 狼人殺
        - 誰是臥底
        - 間諜危機
        - 阿瓦隆
        - 機密代號
        - 吹牛骰
        - 一字千金
        - 政變
        - 花火
        - 心電感應
        - 截碼戰
        - 心電感應 (合作)
        - 圈內人
        - 骷髏與玫瑰
        - 誰是牛頭王
        - 情書
        - 蟑螂撲克
        - 變色龍
        - 不要謝謝
        - 禁語
        - 壽司派對
        - 梗圖大亂鬥
        - 從眾心理
        - 炸彈貓
        - 犯人在跳舞
        - 猜猜看
        - 印加寶藏
        - 妙語說書人
        - 富饒之城
        - Emoji 傳話
        - 星際探險隊
        - 矮人礦坑
        - 地產大亨
        - 骰子街
        - 璀璨寶石
        - 詭影神探
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 發生什麼事？
      placeholder: 例如：按「⛏️ 行動」之後沒有反應
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 原本預期會怎樣？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎麼重現？
      description: 幾個人玩、有沒有加 bot、做了哪些操作
      placeholder: |
        1. 3 個人加 1 個 bot 開局
        2. 輪到我時按 …
        3. …
  - type: input
    id: when
    attributes:
      label: 大概什麼時候發生？
      placeholder: 例如：10/20 晚上 9 點左右
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖
      description: 可以直接把圖片拖進來
