name: 🐛 Bug report
description: Something is broken, stuck, shows the wrong message, or doesn't match the rules
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Not sure it's a bug? Feel free to ask in [Q&A on Discussions](https://github.com/eric0324/slack-gamebuddy/discussions) first.
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - "Lobby / other"
        - "Werewolf / 狼人殺"
        - "Undercover / 誰是臥底"
        - "Spyfall / 間諜危機"
        - "Avalon / 阿瓦隆"
        - "Codenames / 機密代號"
        - "Liar's Dice / 吹牛骰"
        - "Just One / 一字千金"
        - "Coup / 政變"
        - "Hanabi / 花火"
        - "Wavelength / 心電感應"
        - "Decrypto / 截碼戰"
        - "Wavelength co-op / 心電感應 (合作)"
        - "Insider / 圈內人"
        - "Skull / 骷髏與玫瑰"
        - "6 nimmt! / 誰是牛頭王"
        - "Love Letter / 情書"
        - "Cockroach Poker / 蟑螂撲克"
        - "The Chameleon / 變色龍"
        - "No Thanks! / 不要謝謝"
        - "Taboo / 禁語"
        - "Sushi Go! / 壽司派對"
        - "Meme Battle / 梗圖大亂鬥"
        - "Herd Mentality / 從眾心理"
        - "Exploding Kittens / 炸彈貓"
        - "Criminal Dance / 犯人在跳舞"
        - "Wits & Wagers / 猜猜看"
        - "Incan Gold / 印加寶藏"
        - "Dixit / 妙語說書人"
        - "Citadels / 富饒之城"
        - "Emoji Telephone / Emoji 傳話"
        - "The Crew / 星際探險隊"
        - "Saboteur / 矮人礦坑"
        - "For Sale / 地產大亨"
        - "Machi Koro / 骰子街"
        - "Splendor / 璀璨寶石"
        - "Deception / 詭影神探"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: "e.g. Nothing happened after I clicked \"⛏️ 行動\""
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: How many players, any bots, and what you did
      placeholder: |
        1. Started a game with 3 players and 1 bot
        2. On my turn I clicked ...
        3. ...
  - type: input
    id: when
    attributes:
      label: Roughly when did it happen?
      placeholder: "e.g. Oct 20, around 9 PM (UTC+8)"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: You can drag and drop images here
