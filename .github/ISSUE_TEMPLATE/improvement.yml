name: ✨ Improvement
description: Ideas to make an existing game or the lobby easier to use
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Want a brand-new game? Please post it in the [Wishlist on Discussions](https://github.com/eric0324/slack-gamebuddy/discussions) so everyone can vote.
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - "Lobby / other"
        - "Werewolf / 狼人殺"
        - "Undercover / 誰是臥底"
        - "Spyfall / 間諜危機"
        - "Avalon / 阿瓦隆"
        - "Codenames / 機密代號"
        - "Liar's Dice / 吹牛骰"
        - "Just One / 一字千金"
        - "Coup / 政變"
        - "Hanabi / 花火"
        - "Wavelength / 心電感應"
        - "Decrypto / 截碼戰"
        - "Wavelength co-op / 心電感應 (合作)"
        - "Insider / 圈內人"
        - "Skull / 骷髏與玫瑰"
        - "6 nimmt! / 誰是牛頭王"
        - "Love Letter / 情書"
        - "Cockroach Poker / 蟑螂撲克"
        - "The Chameleon / 變色龍"
        - "No Thanks! / 不要謝謝"
        - "Taboo / 禁語"
        - "Sushi Go! / 壽司派對"
        - "Meme Battle / 梗圖大亂鬥"
        - "Herd Mentality / 從眾心理"
        - "Exploding Kittens / 炸彈貓"
        - "Criminal Dance / 犯人在跳舞"
        - "Wits & Wagers / 猜猜看"
        - "Incan Gold / 印加寶藏"
        - "Dixit / 妙語說書人"
        - "Citadels / 富饒之城"
        - "Emoji Telephone / Emoji 傳話"
        - "The Crew / 星際探險隊"
        - "Saboteur / 矮人礦坑"
        - "For Sale / 地產大亨"
        - "Machi Koro / 骰子街"
        - "Splendor / 璀璨寶石"
        - "Deception / 詭影神探"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would you like to change?
      placeholder: "e.g. Dead ends on the map are hard to spot"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What's inconvenient about it today
